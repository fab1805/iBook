        <div class="eyebrow">Bibliothèque personnelle</div>
        <h1>Carnet de Lecture</h1>
      </div>
    </div>
    <div class="header-right">
      <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Livres</div></div>
        <div class="stat"><div class="num" id="statRead">0</div><div class="label">Lus</div></div>
        <div class="stat"><div class="num" id="statAvg">—</div><div class="label">Note moy.</div></div>
      </div>
      <button class="btn btn-primary" id="btnAdd">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter un livre
      </button>
    </div>
  </header>

  <div class="profile-row">
    <span class="profile-label">Bibliothèque de :</span>
    <div class="profile-tabs" id="profileTabs">
      <button class="profile-tab fab" data-value="fabrice"><span class="dot"></span>Fabrice</button>
      <button class="profile-tab al" data-value="anne_laure"><span class="dot"></span>Anne Laure</button>
    </div>
  </div>

  <div class="banner error" id="dbBanner" hidden></div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Chercher par titre ou auteur…">
    </div>
    <div class="segmented" id="statusFilter">
      <button data-value="all" class="active">Tous</button>
      <button data-value="a_lire">À lire</button>
      <button data-value="en_cours">En cours</button>
      <button data-value="lu">Lu</button>
      <button data-value="abandonne">Abandonné</button>
    </div>
    <select class="sort" id="sortSelect">
      <option value="finished" selected>Date de lecture</option>
      <option value="recent">Ajout récent</option>
      <option value="title">Titre A→Z</option>
      <option value="rating">Meilleure note</option>
    </select>
    <div class="segmented view-toggle" id="viewToggle">
      <button data-value="grid" class="active" aria-label="Affichage vignettes" title="Vignettes">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
      </button>
      <button data-value="list" aria-label="Affichage liste" title="Liste">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
    </div>
  </div>

  <div id="gridContainer"></div>

</div>

<div id="modalRoot"></div>

<!-- Supabase JS client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  "use strict";

  // ================================================================
  // CONFIGURATION SUPABASE — à remplacer par les infos de ton projet
  // (Project Settings > API : "Project URL" et clé "anon public")
  // La clé anon n'est PAS secrète : elle est faite pour être utilisée
  // côté client ; la vraie protection se fait via les policies RLS.
  // ================================================================
  const SUPABASE_URL = "https://kgqntzggqkctqovfsscz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XgEqjYAbqof7GDTBQySl3Q_E42AJ06w";
  const CONFIG_IS_PLACEHOLDER = SUPABASE_URL.indexOf("REMPLACER") === 0;

  // ---------- state ----------
  let books = [];
  let sb = null;              // Supabase client
  let realtimeChannel = null;
  let dbReady = false;
  let filterStatus = "all";
  let searchQuery = "";
  let sortMode = "finished";
  let viewMode = "grid";
  let editingId = null;
  let pendingDeleteId = null;

  const STATUS_LABEL = {a_lire:"À lire", en_cours:"En cours", lu:"Lu", abandonne:"Abandonné"};
  const STATUS_ORDER = ["a_lire","en_cours","lu","abandonne"];
  const PROFILES = {
    fabrice:    {label:"Fabrice"},
    anne_laure: {label:"Anne Laure"}
  };
  let currentProfile = "fabrice";
  try{
    const saved = localStorage.getItem("carnet_lecture_profile");
    if(saved && PROFILES[saved]) currentProfile = saved;
  }catch(e){ /* localStorage unavailable — keep default */ }
  try{
    const savedView = localStorage.getItem("carnet_lecture_view");
    if(savedView === "grid" || savedView === "list") viewMode = savedView;
  }catch(e){ /* localStorage unavailable — keep default */ }

  const gridContainer = document.getElementById("gridContainer");
  const modalRoot = document.getElementById("modalRoot");
  const dbBanner = document.getElementById("dbBanner");

  function showBanner(html){ dbBanner.hidden = false; dbBanner.innerHTML = html; }
  function hideBanner(){ dbBanner.hidden = true; }

  // ---------- helpers ----------
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  // dates are stored/edited at the month precision only ("YYYY-MM"),
  // saved to the database as the 1st of that month for compatibility
  // with a SQL "date" column.
  function formatMonthFr(monthIso){
    if(!monthIso) return "";
    try{
      const d = new Date(monthIso + "-01T00:00:00");
      return new Intl.DateTimeFormat("fr-FR", {month:"long", year:"numeric"}).format(d);
    }catch(e){ return monthIso; }
  }

  function currentMonthStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

  function hashHue(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h % 360;
  }
  function coverStyle(book){
    if(book.cover){ return ""; }
    const hue = hashHue(book.title || "livre");
    const hue2 = (hue + 34) % 360;
    return `background:linear-gradient(160deg, hsl(${hue} 32% 26%), hsl(${hue2} 40% 15%));`;
  }

  // small "★ note/10 · mois année" caption, shown on the cover itself —
  // uses la note et la date renseignées sur la fiche. Le nombre de pages est
  // affiché séparément (voir coverPagesHtml), dans son propre badge.
  function coverMetaHtml(book){
    const parts = [];
    if(book.status === "lu" && typeof book.rating === "number"){
      parts.push("★ " + book.rating.toFixed(1) + "/10");
    }
    const d = book.dateStarted;
    if(d) parts.push(formatMonthFr(d));
    return parts.length ? escapeHtml(parts.join(" · ")) : "";
  }

  function coverPagesHtml(book){
    return book.pageCount ? escapeHtml(book.pageCount + " p.") : "";
  }

  function coverInnerHtml(book){
    const meta = coverMetaHtml(book);
    const pages = coverPagesHtml(book);
    const metaChip = meta ? `<div class="cover-meta">${meta}</div>` : "";
    if(book.cover){
      const pagesChip = pages ? `<div class="cover-pages">${pages}</div>` : "";
      return `<img src="${book.cover}" alt="">` + metaChip + pagesChip;
    }
    return `<div class="cover-text">
      <div class="cover-title">${escapeHtml(book.title || "Sans titre")}</div>
      <div class="cover-author">${escapeHtml(book.author || "")}</div>
      ${pages ? `<div class="cover-author" style="opacity:.75; margin-top:2px">${pages}</div>` : ""}
    </div>` + metaChip;
  }

  function starSvg(){
    return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.6l-5.9 3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>`;
  }
  function pencilSvg(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  }

  // ---------- filtering / sorting ----------
  function visibleBooks(){
    let list = books.slice();
    if(filterStatus !== "all"){
      list = list.filter(b => b.status === filterStatus);
    }
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      list = list.filter(b => (b.title||"").toLowerCase().includes(q) || (b.author||"").toLowerCase().includes(q));
    }
    switch(sortMode){
      case "title":
        list.sort((a,b)=> (a.title||"").localeCompare(b.title||"", "fr"));
        break;
      case "rating":
        list.sort((a,b)=> (b.rating ?? -1) - (a.rating ?? -1));
        break;
      case "finished":
        list.sort((a,b)=> (b.dateStarted||"").localeCompare(a.dateStarted||""));
        break;
      default:
        list.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
    }
    return list;
  }

  // ---------- rendering ----------
  function renderStats(){
    const total = books.length;
    const read = books.filter(b=>b.status==="lu").length;
    const rated = books.filter(b=>b.status==="lu" && typeof b.rating === "number");
    const avg = rated.length ? (rated.reduce((s,b)=>s+b.rating,0) / rated.length) : null;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statRead").textContent = read;
    document.getElementById("statAvg").textContent = avg == null ? "—" : avg.toFixed(1);
  }

  // groups a (typically date-sorted) list into year buckets for the "arborescence par année".
  // only meaningful when sorted by reading date — for other sort modes we return a single,
  // unlabeled bucket so the grid/list renders exactly as before.
  function yearGroups(list){
    if(sortMode !== "finished"){
      return [{ year:null, books:list }];
    }
    const groups = [];
    let current = null;
    list.forEach(book=>{
      const year = book.dateStarted ? book.dateStarted.slice(0,4) : null;
      if(!current || current.year !== year){
        current = { year, books:[] };
        groups.push(current);
      }
      current.books.push(book);
    });
    return groups;
  }

  function cardHtml(book){
    const ratingHtml = (book.status === "lu" && typeof book.rating === "number")
      ? `<div class="rating-badge">${starSvg()}${book.rating.toFixed(1)}<span style="color:var(--ink-faint);font-weight:500">/10</span></div>`
      : `<span></span>`;
    const dateLabel = book.status === "lu" && book.dateStarted ? formatMonthFr(book.dateStarted) : (book.status==="en_cours" && book.dateStarted ? "En cours" : "");
    return `
      <div class="card" tabindex="0" role="button" data-id="${book.id}" aria-label="Ouvrir ${escapeHtml(book.title)}">
        <div class="cover" style="${coverStyle(book)}">
          <span class="status-chip" data-status="${book.status}">${STATUS_LABEL[book.status]}</span>
          <button type="button" class="edit-btn" data-edit-id="${book.id}" aria-label="Modifier ${escapeHtml(book.title)}" title="Modifier">${pencilSvg()}</button>
          ${coverInnerHtml(book)}
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(book.title || "Sans titre")}</div>
          <div class="card-author">${escapeHtml(book.author || "Auteur inconnu")}</div>
          <div class="card-foot">
            ${ratingHtml}
            <span class="card-date">${escapeHtml(dateLabel)}</span>
          </div>
        </div>
      </div>`;
  }

  function listRowHtml(book){
    const ratingHtml = (book.status === "lu" && typeof book.rating === "number")
      ? `<div class="list-rating">${starSvg()}${book.rating.toFixed(1)}<span style="color:var(--ink-faint);font-weight:500">/10</span></div>`
      : "";
    const dateLabel = book.status === "lu" && book.dateStarted ? formatMonthFr(book.dateStarted) : (book.status==="en_cours" && book.dateStarted ? "En cours" : "");
    const coverInner = book.cover
      ? `<img src="${book.cover}" alt="">`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5c-1.6-1.3-4-2-6.5-2S2 4 2 4v14.5s2-.5 3.5-.5 3.9.7 5 2c1.1-1.3 3.5-2 5-2s3.5.5 3.5.5V4s-1-.5-3.5-.5-4.9.7-6.5 2Z"/><path d="M12 5.5v14.5"/></svg>`;
    return `
      <div class="list-row" tabindex="0" role="button" data-id="${book.id}" aria-label="Ouvrir ${escapeHtml(book.title)}">
        <div class="list-cover">${coverInner}</div>
        <div class="list-main">
          <div class="list-title">${escapeHtml(book.title || "Sans titre")}</div>
          <div class="list-author">${escapeHtml(book.author || "Auteur inconnu")}</div>
        </div>
        <div class="list-side">
          <span class="status-chip" data-status="${book.status}">${STATUS_LABEL[book.status]}</span>
          ${ratingHtml}
          <span class="list-date">${escapeHtml(dateLabel)}</span>
          <button type="button" class="edit-btn" data-edit-id="${book.id}" aria-label="Modifier ${escapeHtml(book.title)}" title="Modifier">${pencilSvg()}</button>
        </div>
      </div>`;
  }

  function renderGrid(){
    renderStats();
    const list = visibleBooks();

    if(books.length === 0){
      gridContainer.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5.5c-1.6-1.3-4-2-6.5-2S2 4 2 4v14.5s2-.5 3.5-.5 3.9.7 5 2c1.1-1.3 3.5-2 5-2s3.5.5 3.5.5V4s-1-.5-3.5-.5-4.9.7-6.5 2Z"/>
            <path d="M12 5.5v14.5"/>
          </svg>
          <h2>La bibliothèque de ${escapeHtml(PROFILES[currentProfile].label)} est vide</h2>
          <p>Ajoutez un premier livre : titre, statut, et — une fois lu — la note et les impressions. Pour la couverture et les résumés (avant / après lecture), demandez à Claude dans le chat de « compléter » le livre : il ira chercher une vraie couverture et rédigera les deux résumés.</p>
          <button class="btn btn-primary" id="btnAddEmpty">Ajouter mon premier livre</button>
        </div>`;
      document.getElementById("btnAddEmpty").addEventListener("click", ()=> openEditor(null));
      return;
    }

    if(list.length === 0){
      gridContainer.innerHTML = `
        <div class="empty">
          <h2>Aucun résultat</h2>
          <p>Aucun livre ne correspond à ce filtre ou à cette recherche.</p>
        </div>`;
      return;
    }

    const groups = yearGroups(list);
    const itemHtml = viewMode === "list" ? listRowHtml : cardHtml;
    const wrapClass = viewMode === "list" ? "list" : "grid";

    const html = groups.map(group=>{
      const heading = group.year
        ? `<h2 class="year-heading">${escapeHtml(group.year)}<span class="count">${group.books.length} livre${group.books.length>1?"s":""}</span></h2>`
        : (group.year === null && sortMode === "finished"
            ? `<h2 class="year-heading">Sans date<span class="count">${group.books.length} livre${group.books.length>1?"s":""}</span></h2>`
            : "");
      const items = group.books.map(itemHtml).join("");
      return `<div class="year-block">${heading}<div class="${wrapClass}">${items}</div></div>`;
    }).join("");

    gridContainer.innerHTML = html;
    gridContainer.querySelectorAll(".card, .list-row").forEach(el=>{
      el.addEventListener("click", ()=> openReadView(el.dataset.id));
      el.addEventListener("keydown", e=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); openReadView(el.dataset.id); } });
    });
    gridContainer.querySelectorAll(".edit-btn").forEach(btn=>{
      btn.addEventListener("click", e=>{ e.stopPropagation(); openEditor(btn.dataset.editId); });
    });
  }

  // ---------- editor modal ----------
  function bookById(id){ return books.find(b=>b.id===id) || null; }

  // ---------- full-page read view ----------
  function openReadView(id){
    const book = bookById(id);
    if(!book) return;

    const ratingHtml = (book.status === "lu" && typeof book.rating === "number")
      ? `<div class="rating-badge">${starSvg()}${book.rating.toFixed(1)}<span style="color:var(--ink-faint);font-weight:500">/10</span></div>`
      : "";
    const dateLabel = book.dateStarted
      ? (book.status === "lu" ? "Lu en " : book.status === "en_cours" ? "Commencé en " : "") + formatMonthFr(book.dateStarted)
      : "";
    const pagesLabel = book.pageCount ? book.pageCount + " pages" : "";

    const preHtml = book.preSummary
      ? `<p class="read-prose">${escapeHtml(book.preSummary)}</p>`
      : `<p class="read-prose muted">Pas encore de résumé avant lecture.</p>`;

    const postBlock = book.postSummary
      ? `<details class="spoiler-reveal">
           <summary>
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14A2 2 0 004.18 21h15.64a2 2 0 001.87-3.14l-8.18-14a2 2 0 00-3.42 0z"/></svg>
             ⚠️ Attention spoiler — Résumé après lecture
           </summary>
           <p class="read-prose">${escapeHtml(book.postSummary)}</p>
         </details>`
      : `<p class="read-prose muted">Pas encore de résumé après lecture.</p>`;

    modalRoot.innerHTML = `
      <div class="read-page" id="readPage">
        <div class="read-topbar">
          <button class="btn btn-ghost" id="btnBack">← Retour</button>
          <button class="btn btn-ghost" id="btnEditFromRead">✏️ Modifier</button>
        </div>
        <div class="read-content">
          <div class="read-cover" style="${coverStyle(book)}">
            <span class="status-chip static" data-status="${book.status}">${STATUS_LABEL[book.status]}</span>
            ${coverInnerHtml(book)}
          </div>
          <h1 class="read-title serif-display">${escapeHtml(book.title || "Sans titre")}</h1>
          <div class="read-author">${escapeHtml(book.author || "Auteur inconnu")}</div>
          <div class="read-meta">
            ${ratingHtml}
            ${dateLabel ? `<span class="card-date">${escapeHtml(dateLabel)}</span>` : ""}
            ${pagesLabel ? `<span class="card-date">${escapeHtml(pagesLabel)}</span>` : ""}
          </div>

          <div class="read-section">
            <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V5a2 2 0 012-2h13v14H6a2 2 0 00-2 2Zm0 0a2 2 0 002 2h13"/></svg>Résumé avant lecture</h2>
            ${preHtml}
          </div>

          <div class="read-section">
            ${postBlock}
          </div>

          ${book.notes ? `
          <div class="read-section">
            <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0l-1 1-1-1c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8L12 15.4l4.8-5c1.6-1.6 1.6-4.2 0-5.8z"/></svg>Mes impressions</h2>
            <p class="read-prose">${escapeHtml(book.notes)}</p>
          </div>` : ""}
        </div>
      </div>`;

    document.getElementById("btnBack").addEventListener("click", closeModal);
    document.getElementById("btnEditFromRead").addEventListener("click", ()=> openEditor(book.id));
    document.addEventListener("keydown", readEscHandler);
    function readEscHandler(e){
      if(e.key === "Escape"){ closeModal(); document.removeEventListener("keydown", readEscHandler); }
    }
  }

  function openEditor(id){
    editingId = id;
    pendingDeleteId = null;
    const book = id ? bookById(id) : {
      title:"", author:"", status:"a_lire", rating:null,
      dateStarted:currentMonthStr(), pageCount:null,
      notes:"", preSummary:"", postSummary:"", cover:""
    };
    renderModal(book);
  }

  function closeModal(){
    editingId = null;
    pendingDeleteId = null;
    modalRoot.innerHTML = "";
  }

  function renderModal(book){
    const isNew = !editingId;
    const rating = typeof book.rating === "number" ? book.rating : 5;

    modalRoot.innerHTML = `
      <div class="scrim" id="scrim">
        <div class="modal" role="dialog" aria-modal="true" aria-label="${isNew ? "Ajouter un livre" : "Modifier le livre"}">
          <div class="modal-head">
            <h2>${isNew ? "Ajouter un livre" : "Fiche du livre"}</h2>
            <button class="modal-close" id="btnClose" aria-label="Fermer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="editor-grid">
              <div class="cover-col">
                <div class="cover-preview" id="coverPreview" style="${coverStyle(book)}">
                  ${coverInnerHtml(book)}
                </div>
                <div class="field">
                  <label>Couverture (URL d'image)</label>
                  <input type="text" id="coverInput" value="${escapeHtml(book.cover||"")}" placeholder="https://…">
                  <div class="hint">Collez ici un lien d'image trouvé par Claude dans le chat.</div>
                </div>
                <div class="field">
                  <label>Statut de lecture</label>
                  <div class="segmented-grid" id="statusEdit">
                    ${STATUS_ORDER.map(s=>`<button data-value="${s}" class="${book.status===s?'active':''}">${STATUS_LABEL[s]}</button>`).join("")}
                  </div>
                </div>
                <div class="field">
                  <label>Note</label>
                  <div class="rating-row">
                    <input type="range" id="ratingInput" min="0" max="10" step="0.5" value="${rating}">
                    <div class="rating-value" id="ratingValue">${rating.toFixed(1)}</div>
                  </div>
                  <div class="hint">Utilisée si le statut est « Lu ».</div>
                </div>
                <div class="field">
                  <label>Date de lecture (mois)</label>
                  <input type="month" id="dateStarted" value="${escapeHtml(book.dateStarted||"")}">
                </div>
              </div>
              <div class="form-col">
                <div class="field">
                  <label class="req">Titre</label>
                  <input type="text" id="titleInput" value="${escapeHtml(book.title||"")}" placeholder="Le titre du livre">
                </div>
                <div class="field">
                  <label>Auteur</label>
                  <input type="text" id="authorInput" value="${escapeHtml(book.author||"")}" placeholder="Nom de l'auteur">
                </div>

                <div class="field" style="max-width:180px">
                  <label>Nombre de pages</label>
                  <input type="number" id="pageCountInput" min="0" step="1" inputmode="numeric" value="${book.pageCount != null ? book.pageCount : ""}" placeholder="Ex. 320">
                </div>

                <hr class="divider">

                <div class="summary-block">
                  <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V5a2 2 0 012-2h13v14H6a2 2 0 00-2 2Zm0 0a2 2 0 002 2h13"/></svg>Résumé avant lecture</h3>
                  <div class="field">
                    <textarea id="preSummary" placeholder="Quatrième de couverture, sans spoiler…">${escapeHtml(book.preSummary||"")}</textarea>
                    <div class="hint">Sans spoiler — l'aperçu qui donne envie de commencer.</div>
                  </div>
                </div>

                <details class="summary-block spoiler-details">
                  <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14A2 2 0 004.18 21h15.64a2 2 0 001.87-3.14l-8.18-14a2 2 0 00-3.42 0z"/></svg>⚠️ Attention spoiler — Résumé après lecture</summary>
                  <div class="field" style="margin-top:12px">
                    <textarea id="postSummary" placeholder="L'intégralité de l'histoire en résumé, pour vous en souvenir dans quelques années…" style="min-height:120px">${escapeHtml(book.postSummary||"")}</textarea>
                    <div class="hint">Complet, avec la fin — pour se rappeler le livre longtemps après.</div>
                  </div>
                </details>

                <div class="field">
                  <label>Mes impressions</label>
                  <textarea id="notesInput" placeholder="Ce que vous en avez pensé…">${escapeHtml(book.notes||"")}</textarea>
                </div>

                <div class="banner" style="margin-bottom:0">
                  Claude cherche une vraie couverture et rédige les deux résumés — il ne reste plus qu'à coller les 3 résultats ici (couverture, résumé avant, résumé après).
                  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px">
                    <button type="button" class="btn btn-ghost" id="btnCopyPrompt" style="padding:7px 12px; font-size:12.5px">📋 Copier la demande pour Claude</button>
                    <a class="btn btn-ghost" id="btnOpenClaude" href="#" style="padding:7px 12px; font-size:12.5px">🔗 Ouvrir dans l'app Claude</a>
                  </div>
                  <div class="hint" style="margin-top:8px">« Ouvrir dans l'app Claude » fonctionne de façon fiable sur Claude Desktop (Mac/Windows/Linux) ; sur mobile, utilisez plutôt « Copier la demande » puis collez-la dans une conversation Claude.</div>
                </div>
              </div>
            </div>

            <div class="modal-actions">
              <div>
                ${isNew ? "" : `
                  <button class="btn btn-danger" id="btnDeleteStart">Supprimer</button>
                  <span id="deleteConfirmArea"></span>
                `}
              </div>
              <div style="display:flex; gap:10px">
                <button class="btn btn-ghost" id="btnCancel">Annuler</button>
                <button class="btn btn-primary" id="btnSave">${isNew ? "Ajouter" : "Enregistrer"}</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    let currentStatus = book.status || "a_lire";
    const statusEditEl = document.getElementById("statusEdit");
    statusEditEl.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentStatus = btn.dataset.value;
        statusEditEl.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b===btn));
      });
    });

    const ratingInput = document.getElementById("ratingInput");
    const ratingValue = document.getElementById("ratingValue");
    ratingInput.addEventListener("input", ()=>{ ratingValue.textContent = parseFloat(ratingInput.value).toFixed(1); });

    const coverInput = document.getElementById("coverInput");
    const coverPreview = document.getElementById("coverPreview");
    coverInput.addEventListener("input", ()=>{
      const preview = Object.assign({}, book, {cover: coverInput.value.trim()});
      coverPreview.style = coverStyle(preview);
      coverPreview.innerHTML = coverInnerHtml(preview);
    });

    function buildClaudePrompt(){
      const title = document.getElementById("titleInput").value.trim() || "[titre du livre]";
      const author = document.getElementById("authorInput").value.trim();
      const items = [
        "Une URL d'image de couverture réelle et stable (par exemple Fnac, Cultura ou Open Library)",
        "Un résumé avant lecture, sans spoiler (façon quatrième de couverture)",
        "Un résumé après lecture complet, avec la fin, écrit avec tes propres mots (jamais de copier-coller de texte protégé)"
      ];
      if(!author) items.push("Le nom de l'auteur du livre");
      items.push("Le nombre de pages de l'édition courante (un chiffre approximatif si besoin)");
      const list = items.map((it,i)=> (i+1) + ". " + it).join("\n");
      return `Cherche des informations réelles sur le livre "${title}"${author ? " de " + author : ""}. Donne-moi :\n${list}\n\nPrésente chaque élément séparément dans son propre bloc de code (balises \`\`\`), un bloc par élément (couverture, résumé avant, résumé après${!author ? ", auteur" : ""}, nombre de pages), sans rien d'autre dans chaque bloc — pour que je puisse copier chacun en un clic depuis l'appli Claude et le coller directement dans le champ correspondant de mon Carnet de Lecture.`;
    }

    const btnCopyPrompt = document.getElementById("btnCopyPrompt");
    const btnCopyPromptLabel = btnCopyPrompt.textContent;
    btnCopyPrompt.addEventListener("click", async ()=>{
      const text = buildClaudePrompt();
      try{
        await navigator.clipboard.writeText(text);
        btnCopyPrompt.textContent = "Copié ✓";
        setTimeout(()=>{ btnCopyPrompt.textContent = btnCopyPromptLabel; }, 1600);
      }catch(e){
        window.prompt("Copiez ce texte (Ctrl/Cmd+C) :", text);
      }
    });

    document.getElementById("btnOpenClaude").addEventListener("click", (e)=>{
      e.preventDefault();
      window.location.href = "claude://claude.ai/new?q=" + encodeURIComponent(buildClaudePrompt());
    });

    document.getElementById("scrim").addEventListener("click", (e)=>{ if(e.target.id === "scrim") closeModal(); });
    document.getElementById("btnClose").addEventListener("click", closeModal);
    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.addEventListener("keydown", escHandler);

    function escHandler(e){
      if(e.key === "Escape"){ closeModal(); document.removeEventListener("keydown", escHandler); }
    }

    document.getElementById("btnSave").addEventListener("click", async ()=>{
      const title = document.getElementById("titleInput").value.trim();
      if(!title){
        document.getElementById("titleInput").focus();
        document.getElementById("titleInput").style.borderColor = "var(--danger)";
        return;
      }
      const data = {
        title,
        author: document.getElementById("authorInput").value.trim(),
        status: currentStatus,
        rating: currentStatus === "lu" ? parseFloat(ratingInput.value) : (book.rating ?? null),
        dateStarted: document.getElementById("dateStarted").value || "",
        pageCount: document.getElementById("pageCountInput").value.trim() !== "" ? parseInt(document.getElementById("pageCountInput").value, 10) : null,
        notes: document.getElementById("notesInput").value,
        preSummary: document.getElementById("preSummary").value,
        postSummary: document.getElementById("postSummary").value,
        cover: document.getElementById("coverInput").value.trim()
      };
      await saveBook(editingId, data, isNew);
      closeModal();
    });

    if(!isNew){
      document.getElementById("btnDeleteStart").addEventListener("click", ()=>{
        document.getElementById("deleteConfirmArea").innerHTML = `
          <span class="confirm-delete">
            Supprimer définitivement ?
            <button class="btn btn-danger" id="btnDeleteConfirm">Oui, supprimer</button>
          </span>`;
        document.getElementById("btnDeleteStart").style.display = "none";
        document.getElementById("btnDeleteConfirm").addEventListener("click", async ()=>{
          await deleteBook(editingId);
          closeModal();
        });
      });
    }
  }

  // ---------- persistence (Supabase / Postgres) ----------
  // JS objects use camelCase; the "books" table uses snake_case columns.
  function rowToBook(row){
    return {
      id: row.id,
      title: row.title,
      author: row.author || "",
      status: row.status,
      rating: row.rating === null || row.rating === undefined ? null : Number(row.rating),
      dateStarted: row.date_started ? String(row.date_started).slice(0,7) : "",
      dateFinished: row.date_finished ? String(row.date_finished).slice(0,7) : "",
      pageCount: (row.page_count === null || row.page_count === undefined) ? null : Number(row.page_count),
      notes: row.notes || "",
      preSummary: row.pre_summary || "",
      postSummary: row.post_summary || "",
      cover: row.cover || "",
      createdAt: row.created_at ? new Date(row.created_at).getTime() : 0
    };
  }

  function bookToRow(data, profileKey){
    return {
      profile: profileKey,
      title: data.title,
      author: data.author || null,
      status: data.status,
      rating: (data.rating === null || data.rating === undefined) ? null : data.rating,
      date_started: data.dateStarted ? data.dateStarted + "-01" : null,
      date_finished: data.dateFinished ? data.dateFinished + "-01" : null,
      page_count: (data.pageCount === null || data.pageCount === undefined || data.pageCount === "") ? null : parseInt(data.pageCount, 10),
      notes: data.notes || null,
      pre_summary: data.preSummary || null,
      post_summary: data.postSummary || null,
      cover: data.cover || null
    };
  }

  async function fetchProfileBooks(profileKey){
    const {data, error} = await sb.from("books").select("*").eq("profile", profileKey).order("created_at", {ascending:false});
    if(error) throw error;
    books = (data||[]).map(rowToBook);
    hideBanner();
    renderGrid();
  }

  async function saveBook(id, data, isNew){
    if(!dbReady){
      showBanner("<strong>Non connecté —</strong> ce livre n'a pas pu être enregistré. Vérifiez la connexion internet et rechargez la page.");
      return;
    }
    try{
      const row = bookToRow(data, currentProfile);
      if(isNew){
        const {error} = await sb.from("books").insert(row);
        if(error) throw error;
      } else {
        const {error} = await sb.from("books").update(row).eq("id", id);
        if(error) throw error;
      }
      await fetchProfileBooks(currentProfile);
    }catch(err){
      console.error("Erreur d'enregistrement", err);
      showBanner("<strong>Échec de l'enregistrement —</strong> " + escapeHtml(err && err.message ? err.message : "erreur inconnue") + ".");
    }
  }

  async function deleteBook(id){
    if(!dbReady) return;
    try{
      const {error} = await sb.from("books").delete().eq("id", id);
      if(error) throw error;
      await fetchProfileBooks(currentProfile);
    }catch(err){
      console.error("Erreur de suppression", err);
      showBanner("<strong>Échec de la suppression —</strong> " + escapeHtml(err && err.message ? err.message : "erreur inconnue") + ".");
    }
  }

  // ---------- toolbar wiring ----------
  document.getElementById("btnAdd").addEventListener("click", ()=> openEditor(null));

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    searchQuery = e.target.value;
    renderGrid();
  });

  document.getElementById("statusFilter").addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    filterStatus = btn.dataset.value;
    document.querySelectorAll("#statusFilter button").forEach(b=>b.classList.toggle("active", b===btn));
    renderGrid();
  });

  document.getElementById("sortSelect").addEventListener("change", (e)=>{
    sortMode = e.target.value;
    renderGrid();
  });

  document.getElementById("viewToggle").addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    viewMode = btn.dataset.value;
    try{ localStorage.setItem("carnet_lecture_view", viewMode); }catch(e){ /* ignore */ }
    document.querySelectorAll("#viewToggle button").forEach(b=>b.classList.toggle("active", b===btn));
    renderGrid();
  });

  // ---------- profile switching ----------
  function updateProfileTabsUI(){
    document.querySelectorAll("#profileTabs .profile-tab").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.value === currentProfile);
    });
    document.querySelector(".brand-text .eyebrow").textContent =
      "Bibliothèque de " + PROFILES[currentProfile].label;
  }

  function subscribeToProfile(profileKey){
    if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
    if(!dbReady) return;
    books = [];
    renderGrid();
    fetchProfileBooks(profileKey).catch(err=>{
      console.error("Erreur de chargement", err);
      showBanner("<strong>Échec du chargement —</strong> " + escapeHtml(err && err.message ? err.message : "vérifiez les policies RLS et la connexion internet") + ".");
    });
    // live updates from other devices/viewers on this profile's books
    realtimeChannel = sb
      .channel("books-" + profileKey)
      .on("postgres_changes", {event:"*", schema:"public", table:"books", filter:"profile=eq." + profileKey}, ()=>{
        fetchProfileBooks(profileKey).catch(()=>{ /* next write will retry */ });
      })
      .subscribe();
  }

  function switchProfile(profileKey){
    if(profileKey === currentProfile || !PROFILES[profileKey]) return;
    currentProfile = profileKey;
    try{ localStorage.setItem("carnet_lecture_profile", profileKey); }catch(e){ /* ignore */ }
    updateProfileTabsUI();
    subscribeToProfile(profileKey);
  }

  document.getElementById("profileTabs").addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    switchProfile(btn.dataset.value);
  });

  // ---------- initial render ----------
  updateProfileTabsUI();
  document.querySelectorAll("#viewToggle button").forEach(b=>b.classList.toggle("active", b.dataset.value === viewMode));
  document.getElementById("sortSelect").value = sortMode;
  renderGrid();

  // ---------- Supabase init ----------
  if(CONFIG_IS_PLACEHOLDER){
    showBanner("<strong>Configuration Supabase manquante —</strong> ouvre le fichier index.html et remplace les valeurs \"REMPLACER…\" par l'URL et la clé anon de ton projet Supabase (Project Settings → API).");
  } else {
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      dbReady = true;
      hideBanner();
      subscribeToProfile(currentProfile);
    }catch(err){
      console.error("Erreur d'initialisation Supabase", err);
      showBanner("<strong>Impossible de se connecter à Supabase —</strong> " + escapeHtml(err && err.message ? err.message : "vérifie la configuration") + ".");
    }
  }

})();
</script>
